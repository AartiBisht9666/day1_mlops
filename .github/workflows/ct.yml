
name: CT Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/train.py'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      # =====================================================
      # 1. Checkout Code
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # 2. Set up Python
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # =====================================================
      # 3. Install Dependencies
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 4. Retrain Model & Update MLflow Registry
      # =====================================================
      - name: Retrain Model & Update MLflow Registry
        run: |
          python src/train.py

      # =====================================================
      # 5. Commit Updated MLflow Database and Artifacts
      # =====================================================
      - name: Commit Updated MLflow Database and Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add MLflow database if it exists
          if [ -f "mlflow.db" ]; then
            git add mlflow.db
          fi

          # Add MLflow artifacts only if the folder exists
          if [ -d "mlruns" ]; then
            git add mlruns/
          fi

          # Add exported champion model if the folder exists
          if [ -d "models" ]; then
            git add models/
          fi

          # Commit only when there are changes
          if git diff --staged --quiet; then
            echo "No updates to MLflow tracking."
          else
            git commit -m "Automated model retraining (MLflow Champion Update)"
            git push
          fi

      # =====================================================
      # 6. Trigger CI Validation Pipeline
      # =====================================================
      - name: Trigger CI Validation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref main

